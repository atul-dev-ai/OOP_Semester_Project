<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Manage Memberships')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: admin-navbar}"></nav>

<div class="container">
    <div class="glass-card">
        <h3 class="fw-bold mb-4">Pending Membership Requests</h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Student Name</th>
                        <th>Student ID</th>
                        <th>Club</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${requests}">
                        <td th:text="${#temporals.format(req.applicationDate, 'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${req.student.name}" class="fw-bold"></td>
                        <td th:text="${req.student.studentId}"></td>
                        <td th:text="${req.club.clubName}" class="text-primary fw-bold"></td>
                        <td>
                            <form th:action="@{/admin/memberships/{id}/approve(id=${req.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success fw-bold">Approve</button>
                            </form>
                            <form th:action="@{/admin/memberships/{id}/reject(id=${req.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger fw-bold">Reject</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="5" class="text-center text-muted">No pending requests.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
