<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Manage Clubs')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: admin-navbar}"></nav>

<div class="container">
    <div class="glass-card mb-4">
        <h3 class="fw-bold">Create New Club</h3>
        <form action="/admin/clubs" method="post" class="mt-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" name="clubName" class="form-control" placeholder="Club Name" required>
                </div>
                <div class="col-md-6">
                    <input type="text" name="category" class="form-control" placeholder="Category (e.g. Technology, Arts)" required>
                </div>
                <div class="col-md-6">
                    <input type="text" name="presidentName" class="form-control" placeholder="President Name" required>
                </div>
                <div class="col-md-12">
                    <textarea name="description" class="form-control" rows="3" placeholder="Club Description" required></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary fw-bold">Create Club</button>
                </div>
            </div>
        </form>
    </div>

    <h3 class="fw-bold mb-4 mt-5 text-text-color">All Clubs</h3>
    <div class="row g-4 mb-5">
        <div class="col-md-6 col-lg-4" th:each="club : ${clubs}">
            <div class="glass-card h-100 p-4 d-flex flex-column border-0" style="background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(10px);">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h5 class="fw-bold text-success mb-0" th:text="${club.clubName}"></h5>
                    <span class="badge bg-primary text-white rounded-pill px-3 py-1 shadow-sm" th:text="${club.status}"></span>
                </div>
                <div class="mb-3">
                    <span class="badge bg-light text-secondary border me-2" style="font-weight: 500;">
                        <span th:text="${club.category}"></span>
                    </span>
                </div>
                <p class="text-muted small mb-3">
                    <strong class="text-text-color">President:</strong> <span th:text="${club.presidentName}"></span>
                </p>
                <div class="flex-grow-1">
                    <p class="small text-muted" th:text="${club.description}" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;"></p>
                </div>
                <div class="mt-3 pt-3 border-top border-secondary border-opacity-10">
                    <span class="text-muted" style="font-size: 0.75rem;">Club ID: #<span th:text="${club.id}"></span></span>
                </div>
            </div>
        </div>
        
        <div class="col-12" th:if="${#lists.isEmpty(clubs)}">
            <div class="glass-card text-center text-muted p-5 border-0">
                <h5 class="mb-0">No clubs found. Create your first club above!</h5>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
