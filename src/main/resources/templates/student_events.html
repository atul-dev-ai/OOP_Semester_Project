<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Upcoming Events')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: student-navbar}"></nav>

<div class="container">
    <div class="glass-card">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <h3 class="fw-bold mb-4">Upcoming Events</h3>
        <div class="row g-4">
            <div th:each="ev : ${events}" class="col-md-6">
                <div class="glass-card h-100">
                    <h4 th:text="${ev.eventName}" class="text-success fw-bold"></h4>
                    <p class="text-muted mb-1">By: <strong class="text-white" th:text="${ev.club.clubName}"></strong></p>
                    <p class="mb-2" th:text="${ev.description}"></p>
                    <ul class="list-unstyled text-muted small">
                        <li>📍 <span th:text="${ev.venue}"></span></li>
                        <li>📅 <span th:text="${ev.eventDate + ' ' + ev.eventTime}"></span></li>
                        <li>⚠️ Deadline: <span th:text="${ev.registrationDeadline}"></span></li>
                    </ul>
                    <form th:action="@{/student/events/{id}/register(id=${ev.id})}" method="post">
                        <button type="submit" class="btn btn-outline-success btn-sm w-100 mt-2 fw-bold">Register Now</button>
                    </form>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(events)}" class="col-12 text-center text-muted">
                No events found.
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
