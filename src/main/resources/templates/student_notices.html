<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Notice Board')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: student-navbar}"></nav>

<div class="container">
    <div class="glass-card">
        <h3 class="fw-bold mb-4">Notice Board</h3>
        
        <div class="list-group list-group-flush bg-transparent">
            <div th:each="notice : ${notices}" class="list-group-item bg-transparent border-secondary py-3">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1 fw-bold text-info" th:text="${notice.title}"></h5>
                    <small class="text-muted" th:text="${#temporals.format(notice.publishDate, 'dd MMM yyyy')}"></small>
                </div>
                <p class="mb-1 text-muted">From: <strong class="text-white" th:text="${notice.club.clubName}"></strong></p>
                <p class="mb-1" th:text="${notice.description}"></p>
            </div>
            
            <div th:if="${#lists.isEmpty(notices)}" class="text-center text-muted py-4">
                No notices published yet.
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
