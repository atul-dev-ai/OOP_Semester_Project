<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Student Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: student-navbar}"></nav>

<div class="container">
    <div class="glass-card mb-4">
        <h2 class="fw-bold">Welcome, <span th:text="${user.name}"></span>!</h2>
        <p class="text-muted">Explore clubs, join events, and stay updated.</p>
    </div>
    
    <div class="row g-4">
        <div class="col-md-4">
            <div class="glass-card h-100 text-center">
                <h3 class="text-primary">Discover Clubs</h3>
                <p class="text-muted">Find the perfect club for your interests.</p>
                <a href="/student/clubs" class="btn btn-primary mt-2">Browse Clubs</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card h-100 text-center">
                <h3 class="text-success">Upcoming Events</h3>
                <p class="text-muted">Register for exciting activities on campus.</p>
                <a href="/student/events" class="btn btn-success mt-2">View Events</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card h-100 text-center">
                <h3 class="text-info">Notice Board</h3>
                <p class="text-muted">Stay informed with the latest club announcements.</p>
                <a href="/student/notices" class="btn btn-info mt-2 text-dark">Read Notices</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
